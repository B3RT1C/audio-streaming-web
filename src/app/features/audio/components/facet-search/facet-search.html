<div class="facet">
  <div class="facet-box">
    @for (token of tokens(); track tokenKey(token)) {
      <span class="facet-chip" [style.--tone]="chipColor(token.type)" [attr.title]="token.value + ' · ' + chipKind(token)">
        <span class="swatch" aria-hidden="true"></span>
        <span class="chip-copy">
          <span class="chip-value">{{ token.value }}</span>
          <span class="chip-kind">{{ chipKind(token) }}</span>
        </span>
        <button
          type="button"
          class="chip-remove"
          [attr.aria-label]="'Quitar ' + chipKind(token) + ' ' + token.value"
          (click)="remove(token)"
        >
          <span aria-hidden="true">×</span>
        </button>
      </span>
    }
    <label class="facet-field">
      <span class="visually-hidden">Buscar en la biblioteca</span>
      <input
        type="search"
        role="combobox"
        autocomplete="off"
        [value]="draft()"
        [placeholder]="tokens().length ? 'Añadir filtro' : placeholder()"
        [attr.aria-expanded]="open() && groups().length > 0"
        aria-autocomplete="list"
        (input)="onInput($event)"
        (focus)="onFocus()"
        (blur)="onBlur()"
        (keydown)="onKey($event)"
      >
    </label>
  </div>
  @if (open() && groups().length) {
    <div class="facet-menu" role="listbox" aria-label="Sugerencias de filtro">
      @for (group of groups(); track group.type) {
        <p class="facet-group">
          <span class="swatch" [style.background]="group.color" aria-hidden="true"></span>
          {{ group.label }}
        </p>
        @for (item of group.rows; track item.index) {
          <button
            type="button"
            role="option"
            class="facet-option"
            [class.active]="active() === item.index"
            [attr.aria-selected]="active() === item.index"
            [attr.title]="item.row.kind === 'prefix' ? item.row.label : item.row.value"
            (mousedown)="$event.preventDefault(); pick(item.row)"
          >
            <span class="option-label">
              @if (item.row.kind === 'prefix') {
                {{ item.row.insert === '#' ? '#etiqueta' : item.row.insert + ':' }}
              } @else {
                {{ item.row.value }}
              }
            </span>
            <span class="option-meta">
              @if (item.row.kind === 'prefix') {
                {{ item.row.label }}
              } @else if (item.row.count) {
                {{ item.row.count }}
              }
            </span>
          </button>
        }
      }
    </div>
  }
</div>
