<div class="dialog-backdrop" (click)="onBackdropClick($event)">
  <div
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="upload-dialog-title"
    (click)="$event.stopPropagation()"
  >
    <header class="dialog-header">
      <h2 id="upload-dialog-title">Detalles de la subida</h2>
      <p class="dialog-subtitle">
        Revisa el nombre antes de añadir
        {{ drafts().length === 1 ? 'la canción' : 'las canciones' }}.
      </p>
    </header>

    <div class="dialog-body">
      @for (draft of drafts(); track draft.file.name + $index; let i = $index) {
        <fieldset class="draft-fields" [disabled]="busy()">
          <legend>{{ draft.file.name }}</legend>

          <label class="field">
            <span class="field-label">Nombre</span>
            <input
              type="text"
              class="field-input"
              [value]="draft.name"
              [attr.aria-label]="'Nombre para ' + draft.file.name"
              autocomplete="off"
              (input)="onNameInput(i, $event)"
            >
          </label>
        </fieldset>
      }
    </div>

    <footer class="dialog-actions">
      <button type="button" class="btn btn-ghost" [disabled]="busy()" (click)="cancel()">
        Cancelar
      </button>
      <button type="button" class="btn btn-primary" [disabled]="!canConfirm()" (click)="confirm()">
        {{ busy() ? 'Subiendo...' : 'Subir' }}
      </button>
    </footer>
  </div>
</div>
