<section class="filters" (focusin)="askSuggestions()">
  <div class="filters-bar">
    <button
      type="button"
      class="filters-toggle"
      [attr.aria-expanded]="expanded()"
      (click)="toggle()"
    >
      Filtros
      @if (chips().length) {
        <span class="filters-count">{{ chips().length }}</span>
      }
    </button>
    @if (active()) {
      <button type="button" class="btn btn-ghost clear" (click)="cleared.emit()">Limpiar</button>
    }
  </div>

  @if (chips().length) {
    <div class="active-filter" aria-label="Filtros activos">
      @for (chip of chips(); track chip.key + chip.value) {
        <button
          type="button"
          class="tag-chip current"
          [attr.aria-label]="'Quitar ' + chip.label"
          (click)="remove(chip)"
        >
          {{ chip.label }} <span aria-hidden="true">×</span>
        </button>
      }
    </div>
    @if (combinesWithSearch()) {
      <p class="hint">Se combina con la búsqueda</p>
    }
  }

  <div class="filters-body" [class.open]="expanded()">
    @if (mode() === 'library') {
      <label class="field">
        <span class="field-label">Título</span>
        <input
          class="field-input"
          type="text"
          [value]="library().title"
          placeholder="Título o título secundario"
          (input)="onTitle($event)"
        >
      </label>
      <label class="field">
        <span class="field-label">Artista</span>
        <input
          class="field-input"
          type="text"
          [value]="library().artist"
          placeholder="Nombre del artista"
          (input)="onArtist($event)"
        >
      </label>
      <div class="field span-2">
        <span class="field-label">Etiquetas de canción</span>
        <app-tag-editor
          [tags]="library().tags"
          [suggestions]="suggestions()"
          [allowCreate]="false"
          label="Etiquetas de canción"
          placeholder="Buscar etiqueta"
          (tagsChange)="onSongTags($event)"
        ></app-tag-editor>
      </div>
      <div class="field span-2">
        <span class="field-label">Etiquetas de artista</span>
        <app-tag-editor
          [tags]="library().artistTags"
          [suggestions]="suggestions()"
          [allowCreate]="false"
          label="Etiquetas de artista"
          placeholder="Buscar etiqueta"
          (tagsChange)="onArtistTags($event)"
        ></app-tag-editor>
      </div>
      <div class="field span-2">
        <span class="field-label">Etiquetas de lista</span>
        <app-tag-editor
          [tags]="library().playlistTags"
          [suggestions]="suggestions()"
          [allowCreate]="false"
          label="Etiquetas de lista"
          placeholder="Buscar etiqueta"
          (tagsChange)="onPlaylistTags($event)"
        ></app-tag-editor>
      </div>
    } @else {
      <label class="field span-2">
        <span class="field-label">Nombre</span>
        <input
          class="field-input"
          type="text"
          [value]="catalog().q"
          [attr.placeholder]="namePlaceholder()"
          (input)="onName($event)"
        >
      </label>
      <div class="field span-2">
        <span class="field-label">Etiquetas</span>
        <app-tag-editor
          [tags]="catalog().tags"
          [suggestions]="suggestions()"
          [allowCreate]="false"
          label="Etiquetas"
          placeholder="Buscar etiqueta"
          (tagsChange)="onCatalogTags($event)"
        ></app-tag-editor>
      </div>
    }
  </div>
</section>
